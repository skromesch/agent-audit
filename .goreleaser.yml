version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/agent-audit
    binary: agent-audit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/skromesch/agent-audit/internal/tui.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: agent-audit
    repository:
      owner: skromesch
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/skromesch/agent-audit"
    description: "Audit AI coding agent configurations in your project — detect tools, MCP servers, skills, secrets, and misconfigurations across all major ecosystems."
    binaries:
      - agent-audit

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
